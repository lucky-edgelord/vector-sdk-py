<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel</title>
<style>
:root{
  --bg:#ffffff; --card:#f5f6f8; --line:#e2e5ea; --text:#15181d; --muted:#667085;
  --accent:#12b886; --accent-text:#ffffff; --danger:#e03131; --success:#2f9e44; --link:#1971c2;
  --radius:12px; --btn:#e6e9ee; --btn-text:#15181d;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0d10; --card:#14181d; --line:#252b33; --text:#eef1f5; --muted:#8b95a3; --accent:#20c997; --accent-text:#04251b; --link:#74c0fc; --btn:#2a2f37; --btn-text:#fff; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:14px 14px 28px;max-width:720px;margin:0 auto}
a{color:var(--link)}
code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font:13px ui-monospace,Menlo,monospace}
small,.small{color:var(--muted);font-size:12.5px}
#banner{display:none;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px}
#banner.show{display:block}
.content{margin:0 0 12px;white-space:pre-wrap;word-wrap:break-word}
.embed{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px;position:relative;overflow:hidden}
.embed .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.embed .main{min-width:0;flex:1}
.embed .author{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 6px}
.embed .author img{width:20px;height:20px;border-radius:50%}
.embed h2{font-size:18px;line-height:1.25;margin:0 0 6px;font-weight:650}
.embed h2 a{color:inherit;text-decoration:none}
.embed .desc{white-space:pre-wrap;word-wrap:break-word;margin:0}
.embed .thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px;margin:12px 0 0}
.field.wide{grid-column:1/-1}
.field .n{font-weight:650;font-size:12.5px;letter-spacing:.02em;margin:0 0 2px;color:var(--muted);text-transform:uppercase}
.field .v{white-space:pre-wrap;word-wrap:break-word}
.embed .image{display:block;width:100%;border-radius:10px;margin:12px 0 0}
.embed .foot{display:flex;gap:8px;align-items:center;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.accent{position:absolute;left:0;right:0;top:0;height:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
button,.btn,select{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;min-height:40px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.success{background:var(--success);border-color:var(--success);color:#fff;font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.link{color:var(--link)}
select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);min-height:42px}
.multi{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.chip .d{display:block;font-size:11.5px;opacity:.75;font-weight:400}
.selwrap{margin:0 0 8px;width:100%}
.selwrap label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:88vw;transition:.2s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
#modal .sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;padding:18px 16px 22px;max-height:90vh;overflow:auto}
#modal h3{margin:0 0 12px;font-size:17px}
#modal .f{margin:0 0 12px}
#modal label{display:block;font-size:13px;margin:0 0 4px;color:var(--muted)}
#modal input,#modal textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#modal textarea{min-height:96px;resize:vertical}
#modal .err{color:var(--danger);font-size:12.5px;margin:4px 0 0}
#modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.ended .btn,.ended select,.ended .chip{pointer-events:none;opacity:.45}

html[data-dark="1"]{color-scheme:dark}
html[data-dark="0"]{color-scheme:light}
#themecss{display:none}
/* ---- Discord layout: a Discord-style message frame, embed bar, buttons and menus ---- */
html[data-layout="panel"] body{font-family:"gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.375;padding:12px 12px 28px}
html[data-layout="panel"] #avatar{width:40px;height:40px;border-radius:50%;flex:none;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden}
html[data-layout="panel"] #avatar img{width:100%;height:100%;object-fit:cover}
html[data-layout="panel"] #msgcol{min-width:0;flex:1}
#msghead,#avatar{display:none}
#msgwrap,#msgcol{display:block}
#msghead .nm{font-weight:500;color:var(--text);font-size:16px}
#msghead .tag{background:var(--accent);color:var(--accent-text);font-size:10px;font-weight:600;border-radius:3px;padding:1px 5px;align-self:center;line-height:15px;text-transform:uppercase}
#msghead .ts{font-size:12px;color:var(--muted)}
html[data-layout="panel"] .content{margin:0 0 4px}
html[data-layout="panel"] .embed{background:var(--card);border:none;border-left:4px solid var(--line);border-radius:4px;padding:8px 16px 16px 12px;max-width:520px;margin:6px 0 4px}
html[data-layout="panel"] .embed .accent{display:none}
html[data-layout="panel"] .embed h2{font-size:16px;font-weight:600;color:var(--text);margin:0 0 8px}
html[data-layout="panel"] .embed h2 a{color:var(--link)}
html[data-layout="panel"] .embed .author{color:var(--text);font-weight:600;margin:0 0 8px}
html[data-layout="panel"] .embed .desc{font-size:14px;margin:0 0 8px}
html[data-layout="panel"] .embed .thumb{border-radius:3px;width:80px;height:80px}
html[data-layout="panel"] .fields{gap:8px 14px;margin:8px 0 0}
html[data-layout="panel"] .field .n{font-size:14px;font-weight:600;color:var(--text);text-transform:none;letter-spacing:0;margin:0 0 2px}
html[data-layout="panel"] .field .v{font-size:14px}
html[data-layout="panel"] .embed .image{border-radius:4px;margin:16px 0 0}
html[data-layout="panel"] .embed .foot{border:none;padding:0;margin:8px 0 0;font-size:12px}
html[data-layout="panel"] .row{gap:8px;margin:8px 0 0}
html[data-layout="panel"] .btn{min-height:32px;padding:2px 16px;border-radius:3px;font-size:14px;font-weight:500;background:var(--btn);border-color:var(--btn);color:var(--btn-text);gap:6px}
html[data-layout="panel"] .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
html[data-layout="panel"] .btn.success{background:var(--success);border-color:var(--success);color:#fff}
html[data-layout="panel"] .btn.danger{background:var(--danger);border-color:var(--danger)}
html[data-layout="panel"] .btn.link{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
html[data-layout="panel"] .btn:hover:not([disabled]){filter:brightness(.92)}
html[data-layout="panel"] select{background:var(--line);border:none;border-radius:4px;min-height:40px;color:var(--text)}
html[data-layout="panel"] .selwrap label{display:none}
html[data-layout="panel"] .chip{background:var(--line);border:none;border-radius:4px}
html[data-layout="panel"] .chip.on{background:var(--accent)}
html[data-layout="panel"] #modal{align-items:center}
html[data-layout="panel"] #modal .sheet{border-radius:4px;border:none;max-width:440px;background:var(--bg);width:calc(100% - 24px)}
html[data-layout="panel"] #modal label{text-transform:uppercase;font-size:12px;font-weight:700;color:var(--muted)}
html[data-layout="panel"] #modal input,html[data-layout="panel"] #modal textarea{background:var(--line);border:none;border-radius:3px}
html[data-layout="panel"] #toast{border-radius:6px;background:var(--card);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="banner"></div><style id="themecss"></style>
<div id="msgwrap"><div id="avatar"></div><div id="msgcol"><div id="msghead"><span class="nm"></span><span class="tag">Bot</span><span class="ts"></span></div><div id="root"></div></div></div>
<div id="toast"></div>
<div id="modal"><div class="sheet"><h3 id="mtitle"></h3><div id="mfields"></div><div class="actions"><button class="btn" id="mcancel">Cancel</button><button class="btn primary" id="msubmit">Submit</button></div></div></div>
<script type="application/json" id="spec">/*SPEC*/</script>
<script>
(function(){
  "use strict";
  var state = JSON.parse(document.getElementById('spec').textContent);
  var enc = new TextEncoder(), dec = new TextDecoder();
  var ch = null, gotRender = false, helloTimer = null, selected = {}, modalSpec = null, busy = {};
  var me = (window.webxdc && window.webxdc.selfAddr) || '';
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function safeUrl(u){ return /^(https?:|mailto:)/i.test(u) ? u : '#'; }
  function when(unix, style){
    var d = new Date(unix*1000);
    if (style === 'R'){
      var s = Math.round((d - Date.now())/1000), a = Math.abs(s), u = a<60?[a,'second']:a<3600?[Math.round(a/60),'minute']:a<86400?[Math.round(a/3600),'hour']:[Math.round(a/86400),'day'];
      var t = u[0] + ' ' + u[1] + (u[0]===1?'':'s'); return s<0 ? t+' ago' : 'in '+t;
    }
    var date = {dateStyle:'medium'}, time = {timeStyle:'short'};
    var o = style==='t'||style==='T' ? time : style==='d'||style==='D' ? date : {dateStyle:'medium', timeStyle:'short'};
    try { return d.toLocaleString(undefined, o); } catch(e){ return d.toString(); }
  }
  function md(src){
    if (src == null) return '';
    var out = [], codes = [];
    var s = String(src).replace(/`([^`\n]+)`/g, function(_, c){ codes.push(c); return '\u0000' + (codes.length-1) + '\u0000'; });
    s = esc(s)
      .replace(/&lt;color (#[0-9a-fA-F]{3,8})&gt;([\s\S]*?)&lt;\/color&gt;/g, '<span style="color:$1">$2</span>')
      .replace(/&lt;t:(-?\d{1,12})(?::([tTdDfFsSR]))?&gt;/g, function(_, u, st){ return when(+u, st||'f'); })
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
      .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(&lt;([^&]+)&gt;\)/g, function(_, t, u){ return '<a href="'+safeUrl(u.replace(/&amp;/g,'&'))+'" target="_blank" rel="noopener">'+t+'</a>'; })
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, function(_, t, u){ return '<a href="'+safeUrl(u.replace(/&amp;/g,'&'))+'" target="_blank" rel="noopener">'+t+'</a>'; })
      .replace(/^-# (.*)$/gm, '<small>$1</small>')
      .replace(/^#{1,3} (.*)$/gm, '<strong>$1</strong>');
    return s.replace(/\u0000(\d+)\u0000/g, function(_, i){ return '<code>'+esc(codes[+i])+'</code>'; });
  }
  function colourOf(c){ return c == null ? null : '#' + ('000000' + (c >>> 0).toString(16)).slice(-6); }
  function img(u){ return /^attachment:\/\//.test(u||'') ? 'assets/' + u.slice(13) : u; }

  function send(msg){
    if (!ch) return false;
    try { ch.send(enc.encode(JSON.stringify(msg))); return true; } catch(e){ return false; }
  }
  function banner(text){ var b = $('banner'); if (text){ b.textContent = text; b.classList.add('show'); } else b.classList.remove('show'); }
  function toast(text){
    var t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  function renderEmbed(e){
    var el = document.createElement('div'); el.className = 'embed';
    var col = colourOf(e.color);
    var discord = !!state.theme && state.theme.layout !== 'card';
    if (col && discord) el.style.borderLeftColor = col;
    else if (col){ var a = document.createElement('div'); a.className = 'accent'; a.style.background = col; el.appendChild(a); }
    var html = '<div class="top"><div class="main">';
    if (e.author && e.author.name){
      html += '<div class="author">' + (e.author.icon_url ? '<img src="'+esc(img(e.author.icon_url))+'" alt="">' : '') +
              (e.author.url ? '<a href="'+esc(safeUrl(e.author.url))+'" target="_blank" rel="noopener">'+esc(e.author.name)+'</a>' : esc(e.author.name)) + '</div>';
    }
    if (e.title){
      var tt = esc(e.title);
      html += '<h2' + (col && !discord ? ' style="color:'+col+'"' : '') + '>' + (e.url ? '<a href="'+esc(safeUrl(e.url))+'" target="_blank" rel="noopener">'+tt+'</a>' : tt) + '</h2>';
    }
    if (e.description) html += '<p class="desc">' + md(e.description) + '</p>';
    html += '</div>';
    if (e.thumbnail && e.thumbnail.url) html += '<img class="thumb" src="'+esc(img(e.thumbnail.url))+'" alt="">';
    html += '</div>';
    if (e.fields && e.fields.length){
      html += '<div class="fields">';
      e.fields.forEach(function(f){
        html += '<div class="field' + (f.inline ? '' : ' wide') + '"><div class="n">' + esc(f.name) + '</div><div class="v">' + md(f.value) + '</div></div>';
      });
      html += '</div>';
    }
    if (e.image && e.image.url) html += '<img class="image" src="'+esc(img(e.image.url))+'" alt="">';
    var foot = [];
    if (e.footer && e.footer.text) foot.push(esc(e.footer.text));
    if (e.timestamp) foot.push(esc(when(Date.parse(e.timestamp)/1000, 'f')));
    if (foot.length) html += '<div class="foot">' + foot.join(' • ') + '</div>';
    el.insertAdjacentHTML('beforeend', html);
    return el;
  }

  function click(id, values){
    if (busy[id]) return;
    busy[id] = true; setTimeout(function(){ busy[id] = false; }, 700);
    if (!send({t:'click', id:id, values:values||[]})) toast('Not connected to the bot yet');
  }

  function renderComponent(c){
    if (c.type === 'button'){
      var b = document.createElement(c.url ? 'a' : 'button');
      b.className = 'btn ' + (c.style || 'secondary');
      b.innerHTML = (c.emoji ? '<span>'+esc(c.emoji)+'</span>' : '') + '<span>' + esc(c.label || '') + '</span>';
      if (c.url){ b.href = safeUrl(c.url); b.target = '_blank'; b.rel = 'noopener'; }
      else { b.disabled = !!c.disabled; b.onclick = function(){ click(c.id); }; }
      return b;
    }
    var w = document.createElement('div'); w.className = 'selwrap';
    if (c.placeholder) w.innerHTML = '<label>' + esc(c.placeholder) + '</label>';
    if (!(selected[c.id])) selected[c.id] = (c.options||[]).filter(function(o){return o.default;}).map(function(o){return o.value;});
    if (c.max <= 1){
      var s = document.createElement('select'); s.disabled = !!c.disabled;
      s.innerHTML = '<option value="" disabled' + (selected[c.id].length ? '' : ' selected') + '>' + esc(c.placeholder || 'Choose…') + '</option>' +
        (c.options||[]).map(function(o){ return '<option value="'+esc(o.value)+'"'+(selected[c.id][0]===o.value?' selected':'')+'>'+esc((o.emoji?o.emoji+' ':'')+o.label)+'</option>'; }).join('');
      s.onchange = function(){ selected[c.id] = [s.value]; click(c.id, [s.value]); };
      w.appendChild(s);
    } else {
      var m = document.createElement('div'); m.className = 'multi';
      (c.options||[]).forEach(function(o){
        var chip = document.createElement('button'); chip.className = 'chip' + (selected[c.id].indexOf(o.value) >= 0 ? ' on' : ''); chip.disabled = !!c.disabled;
        chip.innerHTML = esc((o.emoji?o.emoji+' ':'') + o.label) + (o.description ? '<span class="d">'+esc(o.description)+'</span>' : '');
        chip.onclick = function(){
          var cur = selected[c.id], i = cur.indexOf(o.value);
          if (i >= 0) { if (cur.length > Math.max(c.min,0)) cur.splice(i,1); } else if (cur.length < c.max) cur.push(o.value); else { toast('Pick up to ' + c.max); return; }
          renderAll(); click(c.id, cur.slice());
        };
        m.appendChild(chip);
      });
      w.appendChild(m);
    }
    return w;
  }

  function applyTheme(t){
    t = t || {};
    var r = document.documentElement;
    r.setAttribute('data-layout', (t.layout === 'discord' ? 'panel' : t.layout) || 'card');
    if (t.dark === true) r.setAttribute('data-dark','1'); else if (t.dark === false) r.setAttribute('data-dark','0'); else r.removeAttribute('data-dark');
    var vars = t.vars || {};
    Object.keys(vars).forEach(function(k){ if (/^--[A-Za-z0-9-]+$/.test(k)) r.style.setProperty(k, vars[k]); });
    $('themecss').textContent = t.css || '';
    $('themecss').style.display = 'none';
    var bot = state.bot || {};
    var head = $('msghead');
    head.querySelector('.nm').textContent = bot.name || 'Bot';
    head.querySelector('.ts').textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    var av = $('avatar'); av.innerHTML = '';
    if (bot.avatar) { var im = document.createElement('img'); im.src = bot.avatar; im.alt = ''; av.appendChild(im); }
    else av.textContent = (bot.name || 'B').trim().charAt(0).toUpperCase();
  }

  function renderAll(){
    var root = $('root'); root.innerHTML = '';
    applyTheme(state.theme);
    document.body.classList.toggle('ended', !!state.closed);
    if (state.title) document.title = state.title;
    if (state.content){ var c = document.createElement('div'); c.className = 'content'; c.innerHTML = md(state.content); root.appendChild(c); }
    (state.embeds||[]).forEach(function(e){ root.appendChild(renderEmbed(e)); });
    (state.rows||[]).forEach(function(r){
      var row = document.createElement('div'); row.className = 'row';
      r.forEach(function(c){ row.appendChild(renderComponent(c)); });
      root.appendChild(row);
    });
    if (state.closed) banner('This panel has ended.');
  }

  function openModal(m){
    modalSpec = m; $('mtitle').textContent = m.title || '';
    var box = $('mfields'); box.innerHTML = '';
    (m.fields||[]).forEach(function(f){
      var d = document.createElement('div'); d.className = 'f';
      var input = f.style === 'paragraph' ? document.createElement('textarea') : document.createElement('input');
      input.id = 'mf_' + f.id; input.value = f.default || ''; input.placeholder = f.placeholder || '';
      if (f.max) input.maxLength = f.max;
      d.innerHTML = '<label for="mf_'+esc(f.id)+'">' + esc(f.label) + (f.required ? ' *' : '') + '</label>';
      d.appendChild(input);
      var er = document.createElement('div'); er.className = 'err'; er.id = 'me_' + f.id; d.appendChild(er);
      box.appendChild(d);
    });
    $('modal').classList.add('show');
  }
  function closeModal(){ $('modal').classList.remove('show'); modalSpec = null; }
  $('mcancel').onclick = closeModal;
  $('msubmit').onclick = function(){
    if (!modalSpec) return;
    var values = {}, ok = true;
    modalSpec.fields.forEach(function(f){
      var v = $('mf_' + f.id).value, er = $('me_' + f.id); er.textContent = '';
      if (f.required && !v.trim()){ er.textContent = 'Required'; ok = false; }
      else if (f.min && v.length < f.min){ er.textContent = 'At least ' + f.min + ' characters'; ok = false; }
      values[f.id] = v;
    });
    if (!ok) return;
    send({t:'submit', modal: modalSpec.id, values: values});
    closeModal();
  };

  function onMessage(bytes){
    var m; try { m = JSON.parse(dec.decode(bytes)); } catch(e){ return; }
    if (m.to && m.to !== me) return;
    if (m.t === 'render'){ gotRender = true; banner(''); state = m.spec; renderAll(); }
    else if (m.t === 'toast') toast(m.text);
    else if (m.t === 'modal') openModal(m.modal);
    else if (m.t === 'closed'){ state.closed = true; renderAll(); }
  }

  renderAll();
  try {
    ch = window.webxdc.joinRealtimeChannel();
    ch.setListener(onMessage);
    send({t:'hello'});
    helloTimer = setInterval(function(){
      if (gotRender){ clearInterval(helloTimer); return; }
      send({t:'hello'});
    }, 4000);
    setTimeout(function(){ if (!gotRender) banner('Waiting for the bot… buttons work once it answers.'); }, 6000);
  } catch(e){
    banner('Preview only: this app is not connected to a bot.');
  }
})();
</script>
</body>
</html>
